name: Publish

# Triggered automatically when release-please merges a Release PR and creates a tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  publish:
    name: npm publish with provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to update the GitHub Release created by release-please
      id-token: write # required for npm OIDC trusted publishing + provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          CI: true
